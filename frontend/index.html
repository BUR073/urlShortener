<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trimly — Fast URL Shortener</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons for clean UI icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <div class="w-full max-w-lg space-y-6">

        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                Trimly.
            </h1>
            <p class="text-slate-400 text-sm">Transform your long URLs into powerful, trackable short links.</p>
        </div>

        <!-- Main Card -->
        <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-2xl shadow-xl space-y-6">

            <!-- Shorten Form -->
            <form id="shortenForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Destination URL</label>
                    <div class="relative">
                        <input type="url" id="targetUrl" required placeholder="https://example.com/very-long-url..."
                            class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm placeholder:text-slate-600 transition">
                    </div>
                </div>
                <button type="submit" id="submitBtn"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] font-medium py-3 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/20 flex items-center justify-center space-x-2">
                    <span>Shorten URL</span>
                </button>
            </form>

            <!-- Result Box (Hidden by default) -->
            <div id="resultBox" class="hidden space-y-3 pt-4 border-t border-slate-800 animate-fadeIn">
                <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-400">Your Generated Link</label>
                <div class="flex items-center justify-between bg-slate-950 border border-slate-800 px-4 py-3 rounded-xl">
                    <a id="shortLink" href="#" target="_blank" class="text-indigo-300 font-medium text-sm truncate mr-2 hover:underline"></a>
                    <button id="copyBtn" onclick="copyToClipboard()"
                        class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center space-x-1 shrink-0">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        <span id="copyText">Copy</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mini Stats Lookup Section -->
        <div class="bg-slate-900/50 border border-slate-800/60 p-6 rounded-2xl space-y-4">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Check Link Clicks</h2>
            <div class="flex space-x-2">
                <input type="text" id="statsCodeInput" placeholder="Enter short code (e.g. AbCdE)"
                    class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-sm placeholder:text-slate-600">
                <button onclick="fetchStats()"
                    class="bg-slate-800 hover:bg-slate-700 font-medium px-4 py-2.5 rounded-xl text-sm transition shrink-0">
                    Lookup
                </button>
            </div>
            <!-- Stats Output Display -->
            <div id="statsResult" class="hidden text-xs text-slate-400 space-y-1 bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                <p>Target: <span id="statTarget" class="text-slate-200"></span></p>
                <p>Total Clicks: <span id="statClicks" class="text-indigo-400 font-bold"></span></p>
            </div>
        </div>

    </div>

    <script>
        // Initialize icons
        lucide.createIcons();

        const API_URL = "http://127.0.0.1:8000";
        let currentShortCode = "";

        // Handle URL Shortening
        document.getElementById('shortenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const targetUrl = document.getElementById('targetUrl').value;
            const submitBtn = document.getElementById('submitBtn');
            const resultBox = document.getElementById('resultBox');
            const shortLink = document.getElementById('shortLink');

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Processing...`;

            try {
                const response = await fetch(`${API_URL}/url`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target_url: targetUrl })
                });

                if (!response.ok) throw new Error('Failed to shorten URL');

                const data = await response.json();
                currentShortCode = data.short_code;
                const fullShortUrl = `${API_URL}/${data.short_code}`;

                shortLink.href = fullShortUrl;
                shortLink.innerText = fullShortUrl;
                resultBox.classList.remove('hidden');

                // Auto-fill the stats input for convenience
                document.getElementById('statsCodeInput').value = data.short_code;
            } catch (error) {
                alert('Error connecting to API. Make sure FastAPI is running!');
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `Shorten URL`;
            }
        });

        // Copy functionality
        function copyToClipboard() {
            const shortLinkText = document.getElementById('shortLink').innerText;
            navigator.clipboard.writeText(shortLinkText);

            const copyText = document.getElementById('copyText');
            copyText.innerText = "Copied!";
            setTimeout(() => { copyText.innerText = "Copy"; }, 2000);
        }

        // Fetch Stats functionality
        async function fetchStats() {
            const code = document.getElementById('statsCodeInput').value.trim();
            const statsResult = document.getElementById('statsResult');
            if (!code) return;

            // Extract just the code if they pasted the whole URL
            const cleanCode = code.split('/').pop();

            try {
                const response = await fetch(`${API_URL}/stats/${cleanCode}`);
                if (!response.ok) throw new Error('Not found');

                const data = await response.json();
                document.getElementById('statTarget').innerText = data.target_url;
                document.getElementById('statClicks').innerText = data.click_count;
                statsResult.classList.remove('hidden');
            } catch (error) {
                alert('Short code not found!');
                statsResult.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
